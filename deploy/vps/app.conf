# Read by deploy.sh and install.sh.
NAME=anthonywiki
BRANCH=main

# next.config.ts sets output: "standalone", so the build leaves a self-contained
# server in .next/standalone (only the node_modules it actually uses). Each
# release is that server plus the static assets Next leaves for a CDN to serve.
build_release() {   # $1 = release directory to create (relative to the repo)
  rm -rf .next
  npm run build
  cp -r .next/standalone "$1"
  cp -r .next/static "$1/.next/static"
  [ -d public ] && cp -r public "$1/public"
  rm -rf "$1/content"; cp -r content "$1/content"
  true
}
