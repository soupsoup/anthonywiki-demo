server {
    listen 80;
    listen [::]:80;
    server_name anthonywiki.antderosa.com;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location ^~ /_next/static/ {
        alias /var/www/anthonywiki/.releases/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The demo's editor saves articles to disk. On Vercel those writes failed
    # (read-only filesystem); here they would stick, letting any visitor
    # rewrite the public demo. Reads only.
    location ^~ /api/articles {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4422;
    }

    location / { proxy_pass http://127.0.0.1:4422; }
}
